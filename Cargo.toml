[package]
name = "cuda-programming-but-rust"
version = "0.1.0"
edition = "2024"

[workspace]
# cuda-oxide 依赖 nightly（需要 rustc-dev 才能编译自定义 codegen 后端），而本工作区
# 钉的是 stable。rustup 会从当前目录向上找 rust-toolchain.toml，一个工作区只能被一个
# 工具链构建，所以必须把 cuda-oxide-example/ 排除出去 —— 它是自带 nightly 工具链的
# 独立区域。这与上游 cuda-rust 仓库的做法一致（见其根 Cargo.toml 的 exclude 注释）。
exclude = ["cuda-oxide-example"]

[dependencies]
anyhow = "1.0.104"

# cuTile Rust 三个 crate 都从 crates.io 取，且**版本必须严格一致**：
# cutile 对 cuda-async / cuda-core 是精确锁版本（`=0.5.0`），单独升一个会直接解析失败。
#
# ⚠️ 0.5.0 有一处破坏性变更（本目录的示例已适配）：
#   cuda-core 0.4 只有一个 Device 类型，既能 Device::new(0) 又能 .new_stream()。
#   0.5.0 把它拆成了两个：
#     Device  —— 纯物理设备身份，不持有 CUDA context，不能建 stream
#     Context —— 执行上下文，持有 primary context，new_stream/default_stream 在它上面
#   因此旧写法 Device::new(0)?.new_stream() 要改成 Context::new(0)?.new_stream()。
#   docs/cutile-rs-book-V0.5.0-zh.CN/ 是上游 cutile-rs/v0.5.0 文档的译本，已同步到
#   0.5 的 Context 写法。
#
# cuda-oxide-example/ 用的是另一套后端（cuda-device / cuda-host，需要 nightly +
# rustc-dev），仍钉 git rev，那边的 rev 与这里无关，不必同步。
cutile = "0.5.0"
cuda-async = "0.5.0"
cuda-core = "0.5.0"
# ---------------------------------------------------------------------------
# cuTile Rust 学习示例（cutile-rs-example/ 目录）
#
# 该目录不是 Cargo 默认的 `examples/`，所以不会被自动发现：每新增一个示例文件，
# 就在这里加一条 [[example]] 注册它（name 建议与文件名去掉 .rs 后一致）。
#
# 运行：
#   cargo check --example 00-add   # 只做类型检查，不需要 GPU
#   cargo run   --example 00-add   # 在 GPU 上执行
#
# 详见 cutile-rs-example/README.md。

[[example]]
name = "00-add"
path = "cutile-rs-example/00-add.rs"

[[example]]
name = "01-hello-world"
path = "cutile-rs-example/01-hello-world.rs"

[[example]]
name = "02-vec-add"
path = "cutile-rs-example/02-vec-add.rs"
